<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/admin-layout}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestión de Vehículos</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<style>
		.card {
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
		}
		.text-purple {
			color: #6f42c1;
			text-decoration: none;
		}
		.text-purple:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
<div layout:fragment="content">
	<section class="home-section">
		<div class="container">
			<div class="row p-2">
				<!-- Mostramos el mensaje dependiendo del rol -->
				<h4 class="mt-2" id="mensajeRol" th:text="'Rol: ' + ${rol}"></h4>

				<div id="sedesContainer" class="row"></div>

				<!-- Mostramos el enlace de registro solo si el rol es ALUMNO o DOCENTE -->
				<p id="registroLink" class="mt-4" th:style="${rol == 'ROLE_ALUMNO' or rol == 'ROLE_DOCENTE' ? 'display:block;' : 'display:none;'}">
					También puedes <a th:href="@{/vehiculos}" class="text-purple fw-bold">solicitar el ingreso de tu vehículo aquí.</a>
				</p>
			</div>
			<hr>

			<!-- Mostrar la sección de seguridad solo si el rol es SEGURIDAD -->
			<div id="seguridadSection" class="mt-2 p-2 mb-5" th:style="${rol == 'ROLE_SEGURIDAD' ? 'display:block;' : 'display:none;'}">
				<div class="row">
					<div class="col-md-12">
						<h5>
							<span id="infoSede"></span>
							<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">Cambiar Sede</button>
						</h5>
					</div>
				</div>
				<div class="row mt-4">
					<div class="col-md-6">
						<h4 class="fw-bold">Ingreso de vehículos:</h4>
						<form id="formIngreso" class="row mt-2 g-3">
							<div class="col-auto">
								<input type="text" class="form-control" id="placaIngreso" placeholder="Ingrese la placa">
							</div>
							<div class="col-auto">
								<button type="submit" class="btn btn-success">Validar Placa</button>
							</div>
						</form>
					</div>
					<div class="col-md-6">
						<h4 class="fw-bold">Salida de vehículos:</h4>
						<form id="formSalida" class="row mt-2 g-3">
							<div class="col-auto">
								<input type="text" class="form-control" id="placaSalida" placeholder="Ingrese la placa">
							</div>
							<div class="col-auto">
								<button type="submit" class="btn btn-danger">Confirmar Salida</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>

	<!-- Modal -->
	<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h4 class="modal-title">Cambio de sede</h4>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<span>Por favor elige en qué sede estás operando:</span>
					<div class="container mt-3">
						<div id="modalSedesContainer" class="row"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script th:src="@{/js/cards-settings.js}"></script>
</body>
</html>

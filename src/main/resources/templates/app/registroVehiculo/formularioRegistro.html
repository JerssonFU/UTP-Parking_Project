<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/formularioRegistro.css}">
    <title>Formulario de registro de vehículos</title>
</head>

<body>
<div layout:fragment="content">
    <section class="home-section">
        <div class="container">
            <h2 class="fw-bold text-center">Formulario de registro de vehículos</h2>
            <div class="container mt-4">
                <div class="row justify-content-center">
                    <div class="col-md-8 p-3">
                        <div class="card p-2 border-light">
                            <div class="card-body">
                                <span class="text-secondary">
                                    Ingrese los datos necesarios para el registro de su vehículo.
                                </span><br>
                                <a th:href="@{/solicitudes}" class="text-purple fw-bold">Mira todas tus solicitudes aquí</a>
                                <form id="registroForm" class="mt-3">
                                    <label class="form-label"> Campus: </label>
                                    <select id="campus" class="form-select border-dark">
                                        <option selected value="Lima Centro">Lima Centro</option>
                                        <option value="Arequipa">Arequipa</option>
                                        <option value="Petit Thouars">Petit Thouars</option>
                                    </select>
                                    <label class="form-label mt-2"> Vehículo: </label>
                                    <select id="vehiculo" class="form-select border-dark">
                                    </select>
                                    <label class="form-label mt-2"> Placa: </label>
                                    <input type="text" id="placa" class="form-control border-dark">
                                    <div class="form-check mt-3">
                                        <input class="form-check-input" type="checkbox" id="terminos">
                                        <label class="form-check-label" for="terminos">
                                            Acepto los términos y condiciones
                                        </label>
                                    </div>
                                    <button type="button" class="btn btn-login fw-bold p-2 mt-4" id="btnRegistrar">
                                        Registrar
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script th:src="@{/js/formularioRegistro.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</div>


</body>
</html>

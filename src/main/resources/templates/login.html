<!-- DOCTYPE -->
<!DOCTYPE HTML>
<html xmlns="http://www.w3.org/1999/xhtml" 
	  xmlns:th="http://www.thymeleaf.org">
  <head>
 	<meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Tell the browser to be responsive to screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    
    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon.ico}">
   
    <title>UTP+ Parking | Universidad Tenológica del Perú</title>
    
    <!-- Bootstrap Core CSS -->
    <link th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
   
    <!-- page css -->
    <link th:href="@{/css/pages/login-register-lock.css}" rel="stylesheet">
   
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
      <link th:href="@{/css/login.component.css}" rel="stylesheet">
    
    <!-- You can change the theme colors from here -->
    <link th:href="@{/css/colors/default-dark.css}"  id="theme" rel="stylesheet">
    
    <style type="text/css"></style>

  </head>
 <body class="card-no-border">

    <div class="preloader">
        <div class="loader">
            <div class="loader__figure"></div>
            <p class="loader__label">UTP+Parking</p>
        </div>
    </div>

    <section class="login">
        <div class="container">
            <div class="row">
                <div class="section-img-login col-md-6 d-flex justify-content-center align-items-center">
                    <img th:src="@{/assets/images/img_login.webp}" alt="Logo" class="img-fluid img-login" />
                </div>
                <div class="col-md-6 p-5 vh-100 d-flex justify-content-center align-items-center">
                    <div class="section-form-login mt-2 p-5">
                        <img th:src="@{/assets/images/logo.png}" alt="Logo" width="300" class="d-inline-block align-text-top" />
                        <p class="mt-3">
                            Puedes hacer todo lo que necesitas para una mejor experiencia con el estacionamiento.
                            <span class="fw-bold">
              Revisa espacios disponibles, registra solicitudes de autorización, trámites y más. De manera más fácil y sencilla.
            </span>
                        </p>

                        <div th:if="${param.error}" class="alert alert-danger">Usuario o Password Inválido</div>

                        <div class="mt-4">

                            <form class="form-horizontal form-material" th:action="@{/login}" method="post">
                                <label class="text-dark">
                                    <span>Ingresa tus datos para <span class="fw-bold">iniciar sesión.</span></span>
                                </label>



                                <div class="mb-3">
                                    <input
                                            id="username"
                                            type="text"
                                            name="username"
                                            class="form-control mt-2 mb-3 border-dark"
                                            autocomplete="on"
                                            placeholder="Código de alumno"
                                            th:value="${#httpServletRequest.getParameter('username')}"
                                    />
                                </div>


                                <div class="mb-3">
                                    <input
                                            id="password"
                                            type="password"
                                            name="password"
                                            class="form-control border-dark mb-3"
                                            placeholder="Contraseña"
                                    />
                                </div>


                                <div class="form-options d-flex justify-content-end">
                                    <div class="wrap-recover-password">
                                        <a href="#" target="_blank" class="recover-password">Recuperar contraseña</a>
                                    </div>
                                </div>
                                <br>
                                <div class="form-group text-center">
                                    <div class="col-xs-12 p-b-20">
                                        <button class="btn btn-block btn-lg btn-info btn-roundedlogin" type="submit" name="login-submit" id="login-submit"  >Ingresar</button>
                                    </div>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


   <script th:src="@{/assets/plugins/jquery/jquery.min.js}"></script>	
   
    <!-- Bootstrap tether Core JavaScript -->
   <script th:src="@{/assets/plugins/bootstrap/js/popper.min.js}"></script>
   <script th:src="@{/assets/plugins/bootstrap/js/bootstrap.min.js}"></script>
   
    <!--Custom JavaScript -->
    <script type="text/javascript">
        $(function() {
            $(".preloader").fadeOut();
        });
        $(function() {
            $('[data-toggle="tooltip"]').tooltip()
        });


        $('#to-recover').on("click", function() {
            $("#loginform").slideUp();
            $("#recoverform").fadeIn();
        });
    </script>
 </body>
</html>

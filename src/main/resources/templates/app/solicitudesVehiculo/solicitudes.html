<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .comentario {
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
<section class="home-section">
    <div class="container">
        <h2 id="titulo" class="fw-bold text-center">Solicitudes</h2>
        <div class="container mt-4">
            <div class="card p-2 border-light">
                <div class="card-body">
                    <div class="container table-responsive">
                        <p class="text-secondary mt-2 mb-0">
                            Aquí puedes ver todas las solicitudes disponibles.
                        </p>
                        <a class="text-purple fw-bold" th:href="@{/vehiculos}">Registra una nueva solicitud aquí</a>
                        <table class="table table-striped mt-3">
                            <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Fecha de solicitud</th>
                                <th>Placa</th>
                                <th>Tipo de Vehículo</th>
                                <th>Estado del trámite</th>
                                <th>Comentario de SAE</th>
                                <th>Fecha de solicitud finalizada</th>
                            </tr>
                            </thead>
                            <tbody id="solicitudes-body">
                            <!-- Contenido dinámico -->
                            </tbody>
                        </table>
                        <button id="exportarExcel" class="btn btn-success">Exportar en Excel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Modal -->
<div class="modal fade" id="comentarioModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title fw-bold">Comentario del SAE</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="comentario-body">
                <!-- Comentario dinámico -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>


<script th:src="@{/js/solicitudes.js}"></script>
</body>
</html>
